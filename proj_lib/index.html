const TOTAL = 64.2;
const tl = gsap.timeline({ paused: true });
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
const $ = s => document.querySelector(s);
const behind = $("#behind"), front = $("#front");
let seed = 7; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const SVGNS = "http://www.w3.org/2000/svg";

<script>
// ============================================================ house kit (premium, restrained)
const EXPO = "expo.out", Q = "power4.out";
// text keyframes evaluated on every update (deterministic for any seek order)
const TXT = [];
function txt(el, kfs) { TXT.push([el, kfs]); return el; }
function txtUpd() { const now = tl.time(); for (const [el, k] of TXT) { let v = k[0][1]; for (const [t, s] of k) if (now >= t - 1e-4) v = s; if (el._v !== v) { el.innerHTML = v; el._v = v; } } }
function count(el, a, b, t0, d, fmt = v => v) { const k = [[0, fmt(a)]]; const n = Math.max(2, Math.round(d * 30));
  for (let i = 0; i <= n; i++) { const p = i / n, e = 1 - Math.pow(1 - p, 3); k.push([t0 + p * d, fmt(Math.round(a + (b - a) * e))]); } return txt(el, k); }
function typeKF(el, s, t0, cps = 26, caret = true) { const k = [[0, ""]];
  for (let i = 1; i <= s.length; i++) k.push([t0 + i / cps, s.slice(0, i) + (caret ? '<b class="caret">|</b>' : "")]);
  k.push([t0 + s.length / cps + 0.5, s]); return txt(el, k); }

// generic element in, with a premium blur-rise
function card(parent, html, css, tin, tout, cls = "abs el card", from = {}) {
  const el = div(parent, html, css, cls); el._tin = tin;
  tl.fromTo(el, { autoAlpha: 0, y: -46, scale: .965, filter: "blur(14px)", ...from }, { autoAlpha: 1, y: 0, x: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: .75, ease: EXPO, immediateRender: false }, tin);
  if (tout) hideAt(el, tout, .28);
  return el;
}
// masked rising line; words = [[text, t, cls?]] (word-by-word) or a string with one time
function rise(parent, words, css, tout, cls = "abs el sans") {
  if (typeof words === "string") words = [[words, css._t]];
  const el = div(parent, "", css, cls); el.style.whiteSpace = "nowrap"; el._tin = words[0][1];
  words.forEach(([w, t, c], i) => {
    const m = document.createElement("span"); m.className = "mask"; m.innerHTML = `<span class="${c || ""}">${w}</span>`;
    if (i) el.appendChild(document.createTextNode(" ")); el.appendChild(m);
    const inner = m.firstChild; gsap.set(inner, { yPercent: 115 });
    tl.fromTo(inner, { yPercent: 115, rotation: 4, filter: "blur(6px)" }, { yPercent: 0, rotation: 0, filter: "blur(0px)", duration: .7, ease: EXPO, immediateRender: false }, t);
  });
  tl.set(el, { autoAlpha: 1 }, words[0][1]);
  if (tout) hideAt(el, tout, .22);
  return el;
}
// chest caption, 2-3 words, word by word
function cap(words, tout, top = 1450) {
  const ws = words.map(([w, t, e]) => [w, t, e ? "e" : "w"]);
  return rise(front, ws, { top: top + "px" }, tout, "cap el");
}
function pop(el, t, s0 = .6, d = .5) { tl.fromTo(el, { autoAlpha: 0, scale: s0 }, { autoAlpha: 1, scale: 1, duration: d, ease: "back.out(1.7)", immediateRender: false }, t); }
function fadeIn(el, t, d = .4, extra = {}) { tl.fromTo(el, { autoAlpha: 0, ...extra.from }, { autoAlpha: 1, duration: d, ease: Q, ...extra.to, immediateRender: false }, t); }
function draw(path, t, d = .8, ease = "power2.inOut") { const L = path.getTotalLength ? path.getTotalLength() : 2000;
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  tl.fromTo(path, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease, immediateRender: false }, t); }
function svgEl(parent, w, h, inner, css, cls = "abs el") { const d = div(parent, `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`, css, cls); return d; }
function defocus(t, s = 1.1) {   // chapter change: lens defocus + settle
  tl.fromTo("#scene", { filter: "blur(22px) brightness(1.06)" }, { filter: "blur(0px) brightness(1)", duration: .55, ease: EXPO, immediateRender: false }, t);
  tl.fromTo("#cam", { scale: s }, { scale: 1, duration: .8, ease: EXPO, immediateRender: false }, t);
}
function push(t, d, s) { tl.to("#cam", { scale: s, duration: d, ease: "sine.inOut" }, t); }
function punch(t, s = 1.07) { tl.fromTo("#cam", { scale: s + .04 }, { scale: s, duration: .45, ease: EXPO, immediateRender: false }, t); }
function shake(el, t) { tl.fromTo(el, { x: -10 }, { x: 0, duration: .4, ease: "elastic.out(1.2,.3)", immediateRender: false }, t); }

const ICON = {
  lock: `<svg width="64" height="64" viewBox="0 0 64 64"><rect x="12" y="28" width="40" height="28" rx="7" fill="#3b2a20"/><path d="M21 28v-7a11 11 0 0 1 22 0v7" fill="none" stroke="#3b2a20" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="42" r="4" fill="#f4ede2"/></svg>`,
  bookmark: `<svg width="30" height="38" viewBox="0 0 30 38"><path d="M3 3h24v32l-12-8-12 8z" fill="#a8652a" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  play: `<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="rgba(255,255,255,.85)"/><path d="M13 10l11 7-11 7z" fill="#3b2a20"/></svg>`,
  check: `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#a8652a"/><path d="M8.5 15.5l4.3 4.2 8.7-9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

function lab(text, t, tout, top) { const el = div(front, `<span class="rule"></span><span style="margin:0 22px">${text}</span><span class="rule"></span>`, { left: "0", right: "0", top: top + "px", textAlign: "center", font: "600 24px Sans", letterSpacing: ".34em", textTransform: "uppercase", color: "var(--ink)", whiteSpace: "nowrap" });
  el._tin = t; fadeIn(el, t, .5, { from: { y: 14, filter: "blur(6px)" }, to: { y: 0, filter: "blur(0px)" } }); if (tout) hideAt(el, tout, .2); return el; }
function dashes(x, y, t, tout, flip = 1) { const d = svgEl(front, 150, 120, `<g fill="none" stroke="#b5652e" stroke-width="8" stroke-linecap="round">
    <path d="M14 92 L 52 100"/><path d="M34 46 L 66 74"/><path d="M84 8 L 94 52"/></g>`, { left: x + "px", top: y + "px", transform: flip < 0 ? "scaleX(-1)" : "none" });
  d.firstChild.classList.add("boil"); d._tin = t; tl.set(d, { autoAlpha: 1 }, t); d.querySelectorAll("path").forEach((p, i) => draw(p, t + i * .07, .22, "power2.out")); if (tout) hideAt(d, tout, .2); return d; }
function wave(t, tout, y = 1080) { const d = svgEl(behind, 1080, 360, `<path d="M-20 300 C 140 280, 200 120, 300 170 S 360 330, 470 250 S 620 40, 760 120 S 900 210, 1100 60" fill="none" stroke="#b5652e" stroke-width="5" stroke-linecap="round"/>`, { left: "0", top: y + "px" });
  d.firstChild.classList.add("boil"); d._tin = t; tl.set(d, { autoAlpha: 1 }, t); draw(d.querySelector("path"), t, .9, "power2.inOut"); if (tout) hideAt(d, tout, .2); return d; }
function poster(lines, label, t, tout, top = 300) {   // brand cover moment: cream paper + cut-out + stacked condensed headline
  bg("bgCream", t); if (tout) bg(null, tout);
  lab(label, t + .02, tout, top);
  let y = top + 62; lines.forEach(([w, col, size, tt]) => { rise(behind, [[w, tt]], { left: "0", right: "0", textAlign: "center", top: y + "px", fontSize: size + "px", color: col }, tout, "abs el cond"); y += size * .86; });
}
// ============================================================ handmade kit
const INK = "#3b2a20", RUST = "#b5452a", CAR = "#a8652a";
// smooth path through points (Catmull-Rom -> cubic)
function cr(pts) { let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)}, ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  return d; }
const J = a => (rnd() - .5) * 2 * a;
// hand-drawn straight-ish line
function hline(x0, y0, x1, y1, j = 2.5) { const n = Math.max(3, Math.round(Math.hypot(x1 - x0, y1 - y0) / 40)), pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t + (i && i < n ? J(j) : 0), y0 + (y1 - y0) * t + (i && i < n ? J(j) : 0)]); } return cr(pts); }
// marker loop around a box (1.15 turns, uneven)
function loop(cx, cy, rx, ry) { const pts = [], n = 22, st = -2.2;
  for (let i = 0; i <= n; i++) { const a = st + i / n * Math.PI * 2 * 1.13, k = 1 + J(.05) + i / n * .06; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); } return cr(pts); }
// hand-drawn arrow with a hooked head
function arrowD(x0, y0, x1, y1, bend = 30) { const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 - bend, a = Math.atan2(y1 - my, x1 - mx), h = 26;
  return [cr([[x0, y0], [mx * .5 + x0 * .5 + J(4), my * .5 + y0 * .5 + J(4)], [mx, my], [x1, y1]]),
          `M${(x1 - h * Math.cos(a - .5)).toFixed(1)} ${(x1 - h * Math.sin(a - .5)).toFixed(1)} L${x1} ${y1} L${(x1 - h * Math.cos(a + .5)).toFixed(1)} ${(x1 - h * Math.sin(a + .5)).toFixed(1)}`]; }
// an svg overlay of hand strokes; strokes = [[d, t, dur, color, width]]
function strokes(parent, w, h, list, css, tin, tout) {
  const el = svgEl(parent, w, h, list.map(([d, , , c, sw]) => `<path d="${d}" fill="none" stroke="${c || INK}" stroke-width="${sw || 6}" stroke-linecap="round" stroke-linejoin="round"/>`).join(""), css);
  el.firstChild.classList.add("boil"); el._tin = tin; tl.set(el, { autoAlpha: 1 }, tin);
  el.querySelectorAll("path").forEach((p, i) => draw(p, list[i][1], list[i][2] || .4, "power1.inOut"));
  if (tout) hideAt(el, tout, .15); return el; }
// paper note: wrapper (tweens) > shadow > torn paper; optional tape
function note(parent, html, css, tin, tout, rot = 0, opt = {}) {
  const el = div(parent, "", css, "abs el note"); el._tin = tin;
  const jag = []; for (let x = 100; x >= 0; x -= 4) jag.push(`${x}% calc(100% - ${(rnd() * 7).toFixed(1)}px)`);
  const clip = opt.torn === false ? "none" : `polygon(0 ${(rnd() * 3).toFixed(1)}px, 100% 0, ${jag.join(",")})`;
  el.innerHTML = `<div class="sh"><div class="pp ${opt.cls || ""}" style="clip-path:${clip}"></div></div><div class="body" style="position:absolute;inset:0;padding:${opt.pad || "34px 40px"}">${html}</div>` +
    (opt.tape !== false ? `<div class="tape" style="left:${opt.tx ?? "calc(50% - 75px)"};top:-18px;transform:rotate(${(J(5)).toFixed(1)}deg)"></div>` : "");
  tl.fromTo(el, { autoAlpha: 0, scale: 1.12, rotation: rot + (opt.spin ?? 5), y: -16 }, { autoAlpha: 1, scale: 1, rotation: rot, y: 0, duration: .26, ease: "power3.out", immediateRender: false }, tin);
  if (tout) hideAt(el, tout, .16);
  return el; }
// handwriting: wipe in like a pen
function hand(parent, text, css, tin, tout, cps = 22) {
  const el = div(parent, `<span class="boil" style="display:inline-block">${text}</span>`, css, "abs el hand"); el._tin = tin;
  const d = Math.min(1.1, Math.max(.22, text.replace(/<[^>]+>/g, "").length / cps));
  tl.set(el, { autoAlpha: 1 }, tin);
  tl.fromTo(el, { clipPath: "inset(-20% 100% -20% -2%)" }, { clipPath: "inset(-20% -2% -20% -2%)", duration: d, ease: "none", immediateRender: false }, tin);
  if (tout) hideAt(el, tout, .15); return el; }
function slapShake(t) { tl.fromTo("#cam", { x: -8, y: 4 }, { x: 0, y: 0, duration: .3, ease: "elastic.out(1.1,.35)", immediateRender: false }, t); }

// ============================================================ soft transitions + new captions
const XF = .45;   // crossfade length
let curBgSoft = null;
bg = function (id, t) {
  if (id) { tl.fromTo("#" + id, { autoAlpha: 0 }, { autoAlpha: 1, duration: XF, ease: "power2.inOut", immediateRender: false }, t);
