name: 1 · Count votes
on:
  schedule: [{ cron: '25 9 * * *' }]     # 14:55 IST, just before the daily writer (≈15:07 IST)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: repo-state, cancel-in-progress: false }
jobs:
  votes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count
        env:
          IG_MAIN_TOKEN: ${{ secrets.IG_MAIN_TOKEN }}
          IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
          IG_NOTES_TOKEN: ${{ secrets.IG_NOTES_TOKEN }}
          IG_NOTES_USER_ID: ${{ secrets.IG_NOTES_USER_ID }}
        run: cd tools && python3 votes.py
      - name: Save
        run: |
          git config user.name zeta-bot; git config user.email zeta-bot@users.noreply.github.com
          git add state/votes && git commit -m "votes $(TZ=Asia/Kolkata date +%F)" && git pull --rebase && git push || echo nothing
