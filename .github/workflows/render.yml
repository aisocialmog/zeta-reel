name: 2 · Render → approve → post
on:
  push:
    branches: [main]
    paths: ['episodes/**/meta.json']
  workflow_dispatch:
    inputs: { episode: { description: 'episodes/<date>/<series>', required: true } }
permissions: { contents: write }
jobs:
  find:
    runs-on: ubuntu-latest
    outputs: { eps: '${{ steps.f.outputs.eps }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then L="${{ github.event.inputs.episode }}";
          else L=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'episodes/**/meta.json' 2>/dev/null | xargs -r -n1 dirname | sort -u); fi
          echo "eps=$(printf '%s\n' $L | jq -R . | jq -sc 'map(select(length>0))')" >> $GITHUB_OUTPUT
  build:
    needs: find
    if: needs.find.outputs.eps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, matrix: { ep: '${{ fromJson(needs.find.outputs.eps) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools
        if: ${{ !endsWith(matrix.ep, 'husstown') }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q numpy scipy pillow
          echo "CHROME=$(which google-chrome || which chromium)" >> $GITHUB_ENV
      - name: ffmpeg (finished reels)
        if: ${{ endsWith(matrix.ep, 'husstown') }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Voice + render
        env: { ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}' }
        run: cd tools && python3 build_episode.py ../${{ matrix.ep }}
      - name: Release + Zapier approval
        env: { GH_TOKEN: '${{ github.token }}', ZAPIER_HOOK_URL: '${{ secrets.ZAPIER_HOOK_URL }}' }
        run: cd tools && python3 handoff.py ../${{ matrix.ep }}

  publish:
    # waits for YOUR approval (GitHub email / app: "Review deployments" → Approve), then waits until post time, then posts
    needs: [find, build]
    if: always() && needs.find.outputs.eps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy: { fail-fast: false, matrix: { ep: '${{ fromJson(needs.find.outputs.eps) }}' } }
    environment: post-${{ (endsWith(matrix.ep, 'chhotu') || endsWith(matrix.ep, 'husstown')) && 'chhotu' || endsWith(matrix.ep, 'aasmaan') && 'aasmaan' || 'notes' }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait until post time
        run: cd tools && python3 wait_until.py ../${{ matrix.ep }}
      - name: Post to Instagram
        env:
          IG_MAIN_TOKEN: ${{ secrets.IG_MAIN_TOKEN }}
          IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
          IG_NOTES_TOKEN: ${{ secrets.IG_NOTES_TOKEN }}
          IG_NOTES_USER_ID: ${{ secrets.IG_NOTES_USER_ID }}
        run: |
          EP=${{ matrix.ep }}; ID="$(basename $(dirname $EP))-$(basename $EP)"
          cd tools && python3 publish.py "$ID"
      - name: Save
        run: |
          git config user.name zeta-bot; git config user.email zeta-bot@users.noreply.github.com
          git add series && git commit -m "published ${{ matrix.ep }}" && git pull --rebase && git push || echo nothing
