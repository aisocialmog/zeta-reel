name: Social Mog · 3 Skills reel render (HyperFrames, parallel)
on:
  push:
    branches: [reel-3skills]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy: { fail-fast: false, matrix: { variant: [room, lib] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --ignore-scripts --no-audit --no-fund hyperframes@0.9.70 gsap > /dev/null
          npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/chs" | tee chs.txt
          echo "HYPERFRAMES_BROWSER_PATH=$(awk '{print $2}' chs.txt | tail -1)" >> $GITHUB_ENV
      - name: Assemble project
        run: |
          cat parts/speaker.mp4.part* > assets/speaker.mp4
          ln -s ../assets proj_${{ matrix.variant }}/assets
          nproc; free -g | head -2
      - name: Render (same settings as local, 4 workers)
        env: { HYPERFRAMES_NO_TELEMETRY: '1', HYPERFRAMES_NO_UPDATE_CHECK: '1', HYPERFRAMES_NO_AUTO_INSTALL: '1', HYPERFRAMES_SKIP_SKILLS: '1', DO_NOT_TRACK: '1' }
        run: |
          cd proj_${{ matrix.variant }}
          npx hyperframes render . -o ../silent.mp4 -q delivery --video-frame-format png -w 4 2>&1 | grep -v hf-progress | tail -20
      - name: Mix sound + 1.12x pacing
        run: |
          ffmpeg -v error -y -i silent.mp4 -i mix/voice_src.mp4 -i mix/music.flac -i mix/sfx.flac -filter_complex "\
          [1:a]aresample=44100,highpass=f=85,equalizer=f=250:t=q:w=1:g=-2.5,equalizer=f=3200:t=q:w=0.9:g=3,equalizer=f=9000:t=q:w=1:g=1.5,deesser=i=0.35,acompressor=threshold=-22dB:ratio=3.5:attack=5:release=90:makeup=5,asplit=2[v][vsc];\
          [2:a]volume=0.13[m];[m][vsc]sidechaincompress=threshold=0.03:ratio=4:attack=20:release=300:makeup=1[md];[3:a]volume=1.0[s];\
          [v][md][s]amix=inputs=3:normalize=0:duration=first,atrim=0:64.2,atempo=1.12,loudnorm=I=-14:TP=-1.5:LRA=11,aresample=44100[a];\
          [0:v]trim=0:64.2,setpts=(PTS-STARTPTS)/1.12[vv]" \
          -map "[vv]" -map "[a]" -r 30 -c:v libx264 -preset slow -crf 20 -maxrate 14M -bufsize 28M -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart final.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4
          ffmpeg -hide_banner -i final.mp4 -af ebur128 -f null - 2>&1 | grep -A3 Summary | grep "I:" || true
          ffmpeg -v error -y -i final.mp4 -vf "fps=1,scale=150:-1,tile=12x5" -frames:v 1 sheet.png
      - name: Publish result to branch out-${{ matrix.variant }}
        run: |
          mkdir /tmp/out && cp final.mp4 /tmp/out/3SkillsReel-${{ matrix.variant }}.mp4 && cp sheet.png /tmp/out/sheet-${{ matrix.variant }}.png
          cd /tmp/out && git init -q -b out-${{ matrix.variant }} && git add . && git -c user.name=zeta-bot -c user.email=zeta-bot@users.noreply.github.com commit -qm "3 skills reel: ${{ matrix.variant }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out-${{ matrix.variant }}
