name: Sample voices (samples/blocky branch only)
on:
  push:
    branches: ['samples/blocky']
    paths: ['samples/**/script.json']
permissions: { contents: write }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy scipy
      - name: Voice every sample (ElevenLabs)
        env: { ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}' }
        run: |
          for d in samples/*/; do python3 engines/chhotu/pipeline/voice.py "$d"; done
      - name: Save voices to the branch
        run: |
          git config user.name zeta-bot; git config user.email zeta-bot@users.noreply.github.com
          git add samples && git commit -m "sample voices" && git push || echo nothing
