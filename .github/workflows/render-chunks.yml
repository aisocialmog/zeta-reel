name: Fast render (parallel chunks, samples/blocky)
on:
  push:
    branches: ['samples/blocky']
    paths: ['jobs/**/job.json']
  workflow_dispatch:
    inputs: { job: { description: 'jobs/<name>', required: true } }
permissions: { contents: write }
env:
  QS: '&res=0.75&aa=0&shadow=2048'
  SOFTWARE_GL: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { job: '${{ steps.p.outputs.job }}', chunks: '${{ steps.p.outputs.chunks }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          J="${{ github.event.inputs.job }}"; [ -z "$J" ] && J=$(git diff --name-only HEAD~1 HEAD -- 'jobs/**/job.json' | head -1 | xargs dirname)
          N=$(jq -r '.chunks // 10' $J/job.json); D=$(jq -r '.duration' $J/data/lines.json)
          echo "job=$J" >> $GITHUB_OUTPUT
          python3 -c "import json,math;N=$N;D=$D;F=round(D*30);s=[round(F*i/N) for i in range(N+1)];print('chunks='+json.dumps([{'i':i,'a':s[i]/30,'b':s[i+1]/30} for i in range(N)]))" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy: { fail-fast: false, matrix: { c: '${{ fromJson(needs.plan.outputs.chunks) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools (static ffmpeg, no apt)
        timeout-minutes: 4
        run: |
          set -e
          curl -fsSL --retry 3 --max-time 120 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            && tar -xJf /tmp/ff.tar.xz -C /tmp && echo "$(ls -d /tmp/ffmpeg-*/bin)" >> $GITHUB_PATH \
            || (sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null)
          mkdir -p ~/.fonts && curl -fsSL --retry 3 --max-time 60 -o ~/.fonts/NotoColorEmoji.ttf https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf && fc-cache -f > /dev/null || true
      - name: Render chunk (10 min cap, 2 tries)
        timeout-minutes: 22
        run: |
          cd ${{ needs.plan.outputs.job }} && export CHROME=$(which google-chrome || which chromium)
          for t in 1 2; do
            timeout 600 node tools/capture.mjs video renders/c${{ matrix.c.i }}.mp4 ${{ matrix.c.a }} ${{ matrix.c.b }} && exit 0
            echo "::warning::chunk ${{ matrix.c.i }} try $t failed/timed out, retrying"
          done; exit 1
      - uses: actions/upload-artifact@v4
        with: { name: 'c${{ matrix.c.i }}', path: '${{ needs.plan.outputs.job }}/renders/c${{ matrix.c.i }}.mp4' }
  merge:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: Tools (static ffmpeg, no apt)
        timeout-minutes: 4
        run: |
          set -e
          curl -fsSL --retry 3 --max-time 120 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            && tar -xJf /tmp/ff.tar.xz -C /tmp && echo "$(ls -d /tmp/ffmpeg-*/bin)" >> $GITHUB_PATH \
            || (sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null)
      - name: Join + sound
        run: |
          J=${{ needs.plan.outputs.job }}; NAME=$(jq -r '.name' $J/job.json)
          ls parts | sort -V | sed "s/^/file 'parts\//; s/$/'/" > list.txt; cat list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -i $J/data/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart $NAME.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 $NAME.mp4
          gh release create "render-$NAME-${{ github.run_number }}" $NAME.mp4 --prerelease --title "$NAME" --notes "fast render" --target samples/blocky
        env: { GH_TOKEN: '${{ github.token }}' }
